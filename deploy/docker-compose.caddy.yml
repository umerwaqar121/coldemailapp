name: quickly

# Use this variant ONLY on a VPS where nothing else is already bound to
# ports 80/443. It runs Caddy for automatic HTTPS. If you have an existing
# nginx/Caddy/Traefik on this box, use docker-compose.no-caddy.yml instead.

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: quickly
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    image: azowail/quickly:v2.4.0
    restart: unless-stopped
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: "postgresql+asyncpg://postgres:postgres@db:5432/quickly"
      QUICKLY_PREBUILT_IMAGE: "1"
    volumes:
      - ./backups:/app/backups

  caddy:
    image: caddy:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy_data:/data
      - ./caddy_config:/config
    env_file: .env
    depends_on:
      - app

volumes:
  pgdata:
    external: true
    name: quickly_pgdata
